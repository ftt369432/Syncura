<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="theme-color" content="#0d9488" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Primary SEO Metadata -->
    <title>Syncura — AI Medication Tracker, Caregiver Swarm & Senior Health Hub</title>
    <meta name="description" content="Syncura is the zero-bloat AI medication schedule and vitals hub for seniors, families, and home health agencies. Features 60-second bottle OCR scanning, zero-touch Bluetooth vitals auto-sync, drug-drug interaction checker, 1-tap voice check-ins, and doctor visit export." />
    <meta name="keywords" content="medication tracker for seniors, caregiver app for elderly parents, pill reminder app, drug interaction checker, home health agency eMAR, electronic visit verification EVV, bluetooth blood pressure sync, dexcom cgm tracker, smart health link QR, family caregiver communication" />
    <meta name="author" content="Syncura Health Technologies" />
    <link rel="canonical" href="https://syncura.health/" />

    <!-- Open Graph / Facebook / WhatsApp Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://syncura.health/" />
    <meta property="og:title" content="Syncura — Caring for aging parents shouldn't feel like a second job." />
    <meta property="og:description" content="Effortless medication schedules, zero-touch vitals, AI drug interaction safety, and caregiver voice check-ins for families and seniors." />
    <meta property="og:image" content="https://syncura.health/og-preview.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://syncura.health/" />
    <meta name="twitter:title" content="Syncura — AI Medication & Senior Caregiver Swarm" />
    <meta name="twitter:description" content="The 24/7 pocket clinical pharmacist and caregiver coordination hub for aging parents and mobile nurses." />
    <meta name="twitter:image" content="https://syncura.health/og-preview.png" />

    <!-- Apple iOS Standalone Mobile App Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Syncura" />

    <!-- AI Search Engine Optimization (GEO) & Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "name": "Syncura",
          "operatingSystem": "iOS, Android, Web, macOS, Windows",
          "applicationCategory": "HealthApplication",
          "offers": {
            "@type": "Offer",
            "price": "9.99",
            "priceCurrency": "USD",
            "priceValidUntil": "2028-12-31"
          },
          "description": "Comprehensive AI medication management, drug interaction checker, zero-touch biometric telemetry bridge, and home health agency eMAR platform.",
          "featureList": [
            "60-Second Optical Pharmacy Label OCR Scanner",
            "Zero-Touch Bluetooth & Wi-Fi Vitals Auto-Sync (Omron, Dexcom G7, Apple Health)",
            "Clinical AI Drug-Drug & Allergy Interaction Safety Interceptor",
            "PRN Sliding Lockout & Daily Toxicity Ceiling Guard",
            "1-Page Printable Doctor Visit Summary PDF & HL7 FHIR R4 Bundle",
            "CMS Electronic Visit Verification (EVV) with GPS Geofencing for Agencies",
            "5-Rights Barcode Patient Wristband Scanner"
          ]
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "How does Syncura help seniors take medications on time?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Syncura replaces rigid clock alarms with meal-relative schedules (e.g. taking Thyroid medication 30 minutes before breakfast with water). It also features spoken audio alarms and 1-tap push-to-talk voice check-ins so seniors never have to type on small screens."
              }
            },
            {
              "@type": "Question",
              "name": "Does Syncura check for dangerous drug interactions and allergies?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Syncura's built-in clinical AI cross-checks all active medications, over-the-counter drugs, and patient allergies in real-time against FDA Black Box warnings and NLM RxNorm databases to prevent life-threatening interactions like blood thinners with NSAIDs or penicillin cross-reactivity."
              }
            }
          ]
        }
      ]
    }
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-brand-500 selection:text-slate-950">

    <script type="module" src="/src/main.tsx"></script>
